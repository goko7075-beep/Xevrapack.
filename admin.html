<!DOCTYPE html>
<html>

.box{

padding:25px;

}

.no{background:red;color:white;}

<body>

<div class="box">
<h1>🛡️ XevraPack Admin Panel</h1>

<h3>Başvurular</h3>

<p>Firebase bağlandıktan sonra başvurular burada görünecek.</p>

<button class="ok">✅ Onayla</button>
<button class="no">❌ Reddet</button>

</div>

</body>
</html>
